name: gcc
source:
  url: https://ftpmirror.gnu.org/gcc/gcc-{version}/gcc-{version}.tar.xz
  verification: sha256
dependencies: [binutils]
host_tools: [make, gcc, gxx, bash, tar, xz]
supplements:
  gmp:
    url: https://ftpmirror.gnu.org/gmp/gmp-{version}.tar.xz
    verification: sha256
  mpfr:
    url: https://ftpmirror.gnu.org/mpfr/mpfr-{version}.tar.xz
    verification: sha256
  mpc:
    url: https://ftpmirror.gnu.org/mpc/mpc-{version}.tar.xz
    verification: sha256
